<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DEJJ Community</title>
  <meta name="description" content="L'application de la communauté DEJJ : événements, boosters, cartes à collectionner, Chabbat et La Saga.">
  <meta name="theme-color" content="#0f2a5c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,500;0,800;1,500&family=Special+Elite&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="cfg-banner" hidden></div>

  <header class="masthead">
    <a class="brand" href="#/" aria-label="DEJJ Community, accueil">
      <img src="dejj-logo.png" alt="" class="brand-logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'brand-fallback',textContent:'DEJJ'}))">
      <span class="brand-sub">Community</span>
    </a>
    <nav id="nav" class="nav" aria-label="Navigation principale"></nav>
    <div class="head-actions">
      <button class="bell" id="bell" data-act="notifs" aria-label="Notifications">🔔<span id="bell-n" hidden>0</span></button>
      <a class="btn btn-small" id="head-account" href="#/compte">Connexion</a>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <p>DEJJ Community · fait avec soin par et pour la communauté</p>
  </footer>

  <nav id="tabbar" class="tabbar" aria-label="Navigation mobile"></nav>

  <div id="modal" class="modal" hidden></div>
  <div id="stage" class="stage" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
